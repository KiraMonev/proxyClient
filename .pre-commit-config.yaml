repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: ["--fix", "--config", "backend/pyproject.toml"]
        files: ^backend/

      - id: ruff-format
        args: ["--config", "backend/pyproject.toml"]
        files: ^backend/
